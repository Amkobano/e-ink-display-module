# GitHub Actions Workflow: Daily Data Collection
# This file tells GitHub what to do and when to do it

name: Update E-Ink Display Data
permissions:
  contents: write
  # (rest of your triggers)

# WHEN should this run?
on:
  # Schedule: Run automatically every day
  schedule:
    # Run at 23:00 UTC = 00:00 CET (midnight = start of new day).
    # Prayer times fetched will be for the new day.
    # GitHub delays can push this to ~01:00 CET at worst.
    - cron: '0 23 * * *'
  
  # Also allow manual trigger (useful for testing)
  workflow_dispatch:

# WHAT should it do?
jobs:
  collect-data:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Berlin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          cd data-collection
          pip install -r requirements.txt
      
      # [DELETED] The "Setup prayer times extraction" step is gone!
      
      - name: Collect and aggregate data
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          CITY_ID: ${{ secrets.CITY_ID }}
          LOCATION: ${{ secrets.LOCATION }}
          PRAYER_TIMES_URL: ${{ secrets.PRAYER_TIMES_URL }}
        run: |
          cd data-collection
          # aggregator.py will now use the environment variables above
          python aggregator.py
      
      - name: Commit and push updated data
        id: commit
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data-collection/output/display_data.json
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Update display data [automated]"
            git pull --rebase origin main
            git push
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi


