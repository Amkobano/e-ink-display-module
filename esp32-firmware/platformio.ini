[platformio]
; Only the production env runs for a bare `pio run` / `pio run -t upload`.
; The diagnostic env runs only when explicitly selected: `pio run -e diagnostic ...`
default_envs = esp32-s3-wroom-1

[env:esp32-s3-wroom-1]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino

; Serial Monitor speed
monitor_speed = 115200

; Upload speed
upload_speed = 921600

; Filesystem configuration
board_build.filesystem = littlefs
board_build.partitions = partitions.csv

; Keep the throwaway display diagnostic out of the normal firmware build.
build_src_filter = +<*> -<diag_display.cpp>

; Flash + PSRAM override — board is ESP32-S3-N16R8 (16MB QIO flash, 8MB OPI PSRAM).
; PlatformIO's default board definition assumes 8MB flash and no PSRAM heap.
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
; qio_opi = QIO (standard) flash + OPI PSRAM. The N16R8 does NOT have OPI flash
; (no EFUSE bit set), so opi_opi causes a bootloader abort. qio_opi enables OPI
; PSRAM heap (MALLOC_CAP_SPIRAM) without touching flash mode.
board_build.arduino.memory_type = qio_opi

; Libraries
lib_deps = 
    ; E-ink display library for Waveshare 7.3" 7-color
    zinggjm/GxEPD2@^1.5.7
    ; Adafruit GFX for graphics
    adafruit/Adafruit GFX Library@^1.11.9
    ; U8g2 fonts for Adafruit GFX - provides clean modern fonts
    olikraus/U8g2_for_Adafruit_GFX@^1.8.0
    ; JSON parsing for API responses
    bblanchon/ArduinoJson@^7.0.4
    ; WiFiClientSecure for HTTPS

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=3
    ; Enable 7-color display support
    -DENABLE_GxEPD2_GFX=1

; Standalone panel diagnostic — flash with:  pio run -e diagnostic -t upload
; Compiles ONLY diag_display.cpp (self-contained): runs white<->black deep-clean
; conditioning cycles, then draws 7 saturated colour bars so you can see whether the
; panel can still produce vivid colour. Does not touch the production firmware.
[env:diagnostic]
extends = env:esp32-s3-wroom-1
build_src_filter = -<*> +<diag_display.cpp>
